services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mabot-db
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: multi_agent_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d multi_agent_bot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mabot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: mabot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    container_name: mabot-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull llama3
        ollama pull nomic-embed-text
        echo "Ollama models ready."
    restart: "no"

  api:
    build: .
    container_name: mabot-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: development
      DEBUG: "true"
      USE_MOCKS: ${USE_MOCKS:-true}
      DATABASE_URL: postgresql+asyncpg://bot:bot@db:5432/multi_agent_bot
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_KEYS: ${API_KEYS:-change-me-in-production}
      WHISPER_MODE: ${WHISPER_MODE:-auto}
      KNOWLEDGE_DIR: /app/knowledge
      AUTO_INGEST_KNOWLEDGE: ${AUTO_INGEST_KNOWLEDGE:-true}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ./knowledge:/app/knowledge:ro
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
  uploads:
