name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings httpx pytest pytest-asyncio sqlalchemy redis structlog orjson tenacity
      - name: Run unit tests
        env:
          USE_MOCKS: "true"
          LLM_PROVIDER: mock
          WHISPER_MODE: mock
        run: pytest -q
